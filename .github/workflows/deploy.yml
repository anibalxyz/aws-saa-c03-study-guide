name: Deploy study site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Read pinned source SHA
        id: pin
        run: echo "sha=$(cat source-sha.txt)" >> "$GITHUB_OUTPUT"

      - name: Checkout source at pinned SHA (read-only)
        uses: actions/checkout@v4
        with:
          repository: ChathurangaVKD/AWS-Certified-Solutions-Architect-Associate-SAA-C03
          ref: ${{ steps.pin.outputs.sha }}
          path: source

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Sync content from pinned source
        run: npm run sync
        env:
          CONTENT_SOURCE_DIR: ${{ github.workspace }}/source

      - name: Assert quiz JSON
        run: npm run sync:assert-quiz

      - name: Build site
        run: npm run build
        env:
          CONTENT_SOURCE_DIR: ${{ github.workspace }}/source

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
